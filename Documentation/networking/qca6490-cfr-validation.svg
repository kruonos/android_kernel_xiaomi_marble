<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">QCA6490 CFR 180 second validation summary</title>
  <desc id="desc">Bar chart showing record counts and a summary of transport integrity and recovery results.</desc>
  <rect width="1000" height="560" fill="#f8fafc"/>
  <text x="60" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">QCA6490 CFR validation</text>
  <text x="60" y="88" font-family="sans-serif" font-size="17" fill="#475569">POCO F5 marble, 5.10.258-Bouquet-v4.9 reference build, 180 seconds</text>

  <g font-family="sans-serif" font-size="16" fill="#0f172a">
    <text x="60" y="146">Raw DBR</text>
    <text x="60" y="206">DBR metadata</text>
    <text x="60" y="266">RX PPDU</text>
    <text x="60" y="326">Correlated final</text>
    <text x="60" y="386">Recovery records</text>
  </g>

  <g>
    <rect x="210" y="120" width="620" height="34" rx="4" fill="#2563eb"/>
    <rect x="210" y="180" width="620" height="34" rx="4" fill="#0ea5e9"/>
    <rect x="210" y="240" width="246" height="34" rx="4" fill="#14b8a6"/>
    <rect x="210" y="300" width="73" height="34" rx="4" fill="#8b5cf6"/>
    <rect x="210" y="360" width="8" height="34" rx="4" fill="#f59e0b"/>
  </g>

  <g font-family="monospace" font-size="16" font-weight="700" fill="#0f172a">
    <text x="846" y="144">28,729</text>
    <text x="846" y="204">28,729</text>
    <text x="472" y="264">11,413</text>
    <text x="299" y="324">3,370</text>
    <text x="234" y="384">356</text>
  </g>

  <line x1="60" y1="430" x2="940" y2="430" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="sans-serif">
    <text x="60" y="468" font-size="18" font-weight="700" fill="#166534">Transport integrity</text>
    <text x="60" y="496" font-size="16" fill="#334155">0 sequence gaps, 0 malformed records, 0 relay drops</text>
    <text x="520" y="468" font-size="18" font-weight="700" fill="#166534">Recovery</text>
    <text x="520" y="496" font-size="16" fill="#334155">6 blind retries, all restored PPDU and DBR</text>
    <text x="60" y="532" font-size="14" fill="#64748b">72,599 records, uncapped capture, clean session start and session end</text>
  </g>
</svg>
